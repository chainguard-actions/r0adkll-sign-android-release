name: Test no release file found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty release directory (no APK or AAB)
        run: |
          mkdir -p /tmp/empty-release
          echo "not a release file" > /tmp/empty-release/readme.txt
          ls -la /tmp/empty-release/

      - id: sign
        uses: .
        continue-on-error: true
        with:
          releaseDirectory: /tmp/empty-release
          signingKeyBase64: dGVzdA==
          alias: test-alias
          keyStorePassword: test-password

      - name: Assert action failed due to missing release file
        env:
          OUTCOME: ${{ steps.sign.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no APK/AAB file is present, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no release file was found"
