name: Test AAB signing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake jarsigner for testing
        run: |
          printf '%s\n' '#!/bin/sh' 'echo "Fake jarsigner called with: $@"' 'exit 0' > /usr/local/bin/jarsigner
          chmod +x /usr/local/bin/jarsigner
          which jarsigner
          jarsigner -help 2>/dev/null || echo "fake jarsigner ready"

      - name: Generate dummy keystore and AAB
        id: setup
        run: |
          RELEASE_DIR="/tmp/aab-release"
          mkdir -p "$RELEASE_DIR"

          # Create a real PKCS12 keystore
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/key.pem \
            -out /tmp/cert.pem \
            -days 1 -nodes \
            -subj "/CN=Test/O=Test/C=US" 2>/dev/null
          openssl pkcs12 -export \
            -out /tmp/test-keystore.p12 \
            -inkey /tmp/key.pem \
            -in /tmp/cert.pem \
            -name test-key \
            -passout pass:testpassword 2>/dev/null

          # Encode keystore to base64
          KEYSTORE_B64=$(base64 -w 0 /tmp/test-keystore.p12)
          echo "keystore_b64=$KEYSTORE_B64" >> "$GITHUB_OUTPUT"

          # Create a minimal dummy AAB (ZIP file)
          mkdir -p /tmp/dummy-aab-content
          echo "dummy manifest" > /tmp/dummy-aab-content/AndroidManifest.xml
          cd /tmp
          zip -r "$RELEASE_DIR/app-release.aab" dummy-aab-content/

          echo "Setup complete"
          ls -la "$RELEASE_DIR"

      - id: sign
        uses: .
        with:
          releaseDirectory: /tmp/aab-release
          signingKeyBase64: ${{ steps.setup.outputs.keystore_b64 }}
          alias: test-key
          keyStorePassword: testpassword
          keyPassword: testpassword

      - name: Assert signedReleaseFile output is set
        env:
          SIGNED_FILE: ${{ steps.sign.outputs.signedReleaseFile }}
          OUTCOME: ${{ steps.sign.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "signedReleaseFile: $SIGNED_FILE"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed, outcome='$OUTCOME'"
            exit 1
          fi
          if [ -z "$SIGNED_FILE" ]; then
            echo "FAIL: signedReleaseFile output is empty"
            exit 1
          fi
          if [ ! -f "$SIGNED_FILE" ]; then
            echo "FAIL: signed file does not exist at '$SIGNED_FILE'"
            exit 1
          fi
          echo "PASS: AAB signed successfully at '$SIGNED_FILE'"
