name: Test missing release directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: sign
        uses: .
        continue-on-error: true
        with:
          releaseDirectory: /tmp/nonexistent-directory-that-does-not-exist
          signingKeyBase64: dGVzdA==
          alias: test-alias
          keyStorePassword: test-password

      - name: Assert action failed due to missing directory
        env:
          OUTCOME: ${{ steps.sign.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when release directory does not exist, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when release directory was missing"
